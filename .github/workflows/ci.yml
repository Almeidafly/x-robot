name: ci
on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**', 'release/**', 'hotfix/**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      # Tests use only the local fixture server on 127.0.0.1 — never external sites.
      - run: npm test
